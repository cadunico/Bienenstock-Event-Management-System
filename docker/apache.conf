# BIENENSTOCK — Configuração do Apache para o container
# - Habilita .htaccess (AllowOverride) para a proteção do diretório uploads/
# - Bloqueia o acesso web a arquivos sensíveis

<Directory /var/www/html>
    AllowOverride All
    Require all granted
    Options -Indexes
</Directory>

# Arquivos sensíveis: nunca servíveis pelo navegador
<FilesMatch "^(config\.php|schema\.sql|install_cli\.php)$">
    Require all denied
</FilesMatch>

# Atrás de um proxy reverso (Caddy/Traefik/nginx) que termina o TLS,
# o pedido chega em HTTP. Detectar o esquema original via X-Forwarded-Proto
# para que o app gere links https e o check-in por webcam funcione.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
