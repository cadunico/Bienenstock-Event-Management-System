services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bienenstock}
      MYSQL_USER: ${MYSQL_USER:-bienenstock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bienenstock}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bienenstock

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-bienenstock}
      DB_USER: ${MYSQL_USER:-bienenstock}
      DB_PASS: ${MYSQL_PASSWORD:-bienenstock}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - uploads_data:/var/www/html/uploads
    networks:
      - bienenstock

volumes:
  db_data:
  uploads_data:

networks:
  bienenstock:
